# vim: set ft=toml :


# https://github.com/jdx/mise/pull/11354
min_version = '2026.7.15'


[hooks]
postinstall = [{ task = 'hooks-install' }, { run = 'pixi install --all' }]


[settings]
experimental = true
locked = true
lockfile = true
lockfile_platforms = ['linux-x64', 'macos-arm64']


[task_config]
shell = 'sh -euo pipefail -c'


[tasks.build]
alias = 'check'
depends = ['lint']
run = 'pixi run -- zensical build --clean'

[tasks.hooks-install]
hide = true
run = [{ task = 'hooks-uninstall' }, 'hk install --mise']

[tasks.hooks-uninstall]
hide = true
run = 'hk uninstall'

[tasks.lint]
run = """\
if test -n "${CI:-}"; then \
  HK_CMD='check'; \
else \
  HK_CMD='fix'; \
fi; \
hk "${HK_CMD}" --all"""

[tasks.lock]
# required to correctly initialize lockfile when locked = true
env.MISE_LOCKED = '0'
run = ['mise install', 'mise lock', 'pixi lock']

[tasks.serve]
run = 'pixi run -- zensical serve --open'

[tasks.sync-hk-pkl-version]
env.BAK = '.bak'
env.HK_PKL = 'hk.pkl'
env.HK_VERSION = '''{{ exec(command='hk version --quiet') }}'''
hide = true
run = [
  'sed -Ei"${BAK}" -- "/^(amends|import) / s/[0-9]+\.[0-9]+\.[0-9]+/${HK_VERSION}/g" "${HK_PKL}"',
  'rm -- "${HK_PKL}${BAK}"',
]
shell = 'sh -eu -c'

[tasks.upgrade]
# required to correctly initialize lockfile when locked = true
env.MISE_LOCKED = '0'
run = [
  'mise upgrade --local',
  'mise lock',
  { task = 'sync-hk-pkl-version' },
  'pixi update',
]


[tools]
hk = '1.54.0'
pixi = 'v0.76.1'
