# vim: set ft=yaml :


name: 'Check'

on:
  push:
    branches-ignore:
      - 'main'

defaults:
  run:
    shell: 'sh -euo pipefail {0}'

permissions:
  contents: 'read'

jobs:
  check:
    runs-on: 'ubuntu-26.04'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v7.0.1'
      - name: 'mise setup'
        uses: 'jdx/mise-action@v4.2.3'
      - run: 'mise run build'
