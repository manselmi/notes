# vim: set ft=yaml :


name: 'Renovate'

on:
  schedule:
    - cron: '0 5 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:


defaults:
  run:
    shell: 'sh -euo pipefail {0}'

permissions:
  contents: 'read'

jobs:

  renovate:
    name: 'Renovate'
    environment:
      name: 'renovate'
      deployment: false
    runs-on: 'ubuntu-26.04'
    steps:
      - name: 'Create GitHub app token'
        id: 'app-token'
        uses: 'actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510' # v3.3.0
        with:
          client-id: '${{ vars.RENOVATE_APP_CLIENT_ID }}'
          private-key: '${{ secrets.RENOVATE_APP_PRIVATE_KEY }}'
          owner: '${{ github.repository_owner }}'
          repositories: '${{ github.repository }}'
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - name: 'Renovate'
        uses: 'renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776' # v46.3.10
        env:
          RENOVATE_ALLOWED_COMMANDS: '^mise run sync-hk-pkl-version$'
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: 'mise,pixi'
          RENOVATE_REPOSITORIES: '${{ github.repository }}'
        with:
          configurationFile: 'renovate.json'
          docker-cmd-file: '.github/renovate-entrypoint.sh'
          token: '${{ steps.app-token.outputs.token }}'
