# vim: set ft=yaml :


name: 'Renovate'

on:
  schedule:
    - cron: '0 5 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:


defaults:
  run:
    shell: 'sh -euo pipefail {0}'

permissions:
  contents: 'read'

jobs:

  renovate:
    name: 'Renovate'
    environment:
      name: 'renovate'
      deployment: false
    runs-on: 'ubuntu-26.04'
    steps:
      - name: 'Create GitHub app token'
        id: 'app-token'
        uses: 'actions/create-github-app-token@v3.2.0'
        with:
          client-id: '${{ vars.RENOVATE_APP_CLIENT_ID }}'
          private-key: '${{ secrets.RENOVATE_APP_PRIVATE_KEY }}'
          owner: '${{ github.repository_owner }}'
          repositories: '${{ github.repository }}'
      - name: 'Checkout'
        uses: 'actions/checkout@v7.0.1'
      # - name: 'mise setup'
      #   uses: 'jdx/mise-action@v4.2.3'
      - name: 'Renovate'
        uses: 'renovatebot/github-action@v46.1.21'
        env:
          RENOVATE_ALLOWED_COMMANDS: '^mise run sync-hk-pkl-version$'
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: 'mise,pixi'
          RENOVATE_REPOSITORIES: '${{ github.repository }}'
        with:
          configurationFile: 'renovate.json'
          token: '${{ steps.app-token.outputs.token }}'
