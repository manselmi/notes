# vim: set ft=yaml :


name: 'CI'

on:
  push:

defaults:
  run:
    shell: 'sh -euo pipefail {0}'

permissions:
  contents: 'read'

jobs:

  check:
    name: 'Check'
    runs-on: 'ubuntu-26.04'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v7.0.1'
      - name: 'mise setup'
        uses: 'jdx/mise-action@v4.2.4'
      - name: 'Check'
        run: 'mise run check'

  deploy-pages:
    name: 'Deploy pages'
    needs: ['check']
    if: 'github.ref_name == github.event.repository.default_branch'
    environment:
      name: 'github-pages'
      url: '${{ steps.deploy-pages.outputs.page_url }}'
    permissions:
      contents: 'read'
      id-token: 'write'
      pages: 'write'
    runs-on: 'ubuntu-26.04'
    steps:
      - name: 'Configure pages'
        uses: 'actions/configure-pages@v6.0.0'
      - name: 'Checkout'
        uses: 'actions/checkout@v7.0.1'
      - name: 'mise setup'
        uses: 'jdx/mise-action@v4.2.4'
      - name: 'Build'
        run: 'mise run build'
      - name: 'Upload pages artifact'
        uses: 'actions/upload-pages-artifact@v5.0.0'
        with:
          path: 'site'
      - name: 'Deploy pages'
        id: 'deploy-pages'
        uses: 'actions/deploy-pages@v5.0.0'
